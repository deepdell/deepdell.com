name = "deepdell-contact"
main = "worker/contact.js"
compatibility_date = "2026-09-17"
workers_dev = true

# GitHub Pages remains the frontend. Cloudflare handles only the contact/audit API routes.
[[routes]]
pattern = "deepdell.com/api/*"
zone_name = "deepdell.com"

[[routes]]
pattern = "www.deepdell.com/api/*"
zone_name = "deepdell.com"

# Cloudflare Workers Rate Limiting (shared across isolates). period must be 10 or 60 seconds.
[[ratelimits]]
name = "AUDIT_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
