name: DEEPDELL Production QA

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'script.js'
      - 'site.css'
      - 'qa/**'
      - '.github/workflows/production-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.64.1
          npx playwright install chromium --with-deps
      - name: Run production browser QA
        run: npx playwright test qa/production.spec.js --workers=1
